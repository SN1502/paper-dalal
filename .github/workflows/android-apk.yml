name: Build Android APK

# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0
# to also attach the APK to a GitHub Release you can download on your phone.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test the trading engine
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PaperDalal-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperDalal-apk
          path: PaperDalal-*.apk
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PaperDalal-*.apk
